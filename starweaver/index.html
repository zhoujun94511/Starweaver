<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Starweaver</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230c1828'/%3E%3Ccircle cx='32' cy='10' r='4.2' fill='%235ce8ff'/%3E%3Cpath d='M32 14v5' stroke='%234b627d' stroke-width='3.5' stroke-linecap='round'/%3E%3Crect x='11' y='19' width='42' height='31' rx='13' fill='%23f4f8ff' stroke='%23ff9238' stroke-width='3'/%3E%3Crect x='17' y='25' width='30' height='16' rx='7' fill='%23102033'/%3E%3Ccircle cx='25.5' cy='33' r='3.6' fill='%235ce8ff'/%3E%3Ccircle cx='38.5' cy='33' r='3.6' fill='%235ce8ff'/%3E%3Cpath d='M28.5 38.5q3.5 3 7 0' fill='none' stroke='%2352ffb8' stroke-width='2.2' stroke-linecap='round'/%3E%3Crect x='22' y='52' width='20' height='5' rx='2.5' fill='%23ff9238'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/ui/styles.css" />
  <style>
    #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#152942 0%,#091220 55%,#040810 100%);color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:opacity .42s ease,visibility .42s ease;user-select:none;overflow:hidden}
    #boot-splash.fade-out{opacity:0;visibility:hidden;pointer-events:none}
    .boot-orbit{position:relative;width:88px;height:88px;margin-bottom:24px;display:grid;place-items:center}
    .boot-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(92,232,255,.16);border-top-color:#5ce8ff;border-right-color:#52ffb8;animation:bootSpin 1.35s linear infinite}
    .boot-ring.inner{inset:13px;border-width:2px;border-color:rgba(255,169,77,.14);border-bottom-color:#ffa94d;animation:bootSpinRev 1.9s linear infinite}
    .boot-core{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#5ce8ff 55%,#1f78ff 100%);box-shadow:0 0 22px rgba(92,232,255,.85);animation:bootPulse 1.6s ease-in-out infinite}
    .boot-title{font-size:clamp(20px,3.6vw,30px);font-weight:800;letter-spacing:.22em;text-transform:uppercase;background:linear-gradient(90deg,#ffffff 0%,#8ff3ff 52%,#ffd089 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;padding:0 16px}
    .boot-sub{margin-top:10px;font-size:13px;letter-spacing:.08em;color:rgba(210,232,255,.72)}
    .boot-bar{margin-top:20px;width:min(260px,68vw);height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
    .boot-bar-fill{width:18%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#5ce8ff,#52ffb8,#ffa94d);transition:width .22s ease}
    @keyframes bootSpin{to{transform:rotate(360deg)}}
    @keyframes bootSpinRev{to{transform:rotate(-360deg)}}
    @keyframes bootPulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.18);opacity:1}}
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite">
    <div class="boot-orbit" aria-hidden="true">
      <div class="boot-ring"></div>
      <div class="boot-ring inner"></div>
      <div class="boot-core"></div>
    </div>
    <div class="boot-title">Welcome to Starweaver</div>
    <div class="boot-sub" id="boot-splash-status">Igniting orbital navigation…</div>
    <div class="boot-bar"><div class="boot-bar-fill" id="boot-splash-fill"></div></div>
  </div>
  <canvas id="game-canvas" role="img" aria-label="Starweaver 3D game canvas"></canvas>
  <div id="hud-root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

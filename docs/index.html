ute home.",zh:"\u4F4D\u4E8E\u673A\u9996\u7684\u5149\u5B66\u5BFB\u661F\u4EEA\u8231\u4F4D\uFF0C\u5B89\u88C5\u3010\u661F\u9645\u822A\u56FE\u5BFC\u822A\u6838\u5FC3\u3011\u5373\u53EF\u89E3\u7B97\u8FD4\u822A\u8DC3\u8FC1\u822A\u7EBF\u3002"}},repair_propulsion:{id:"repair_propulsion",level:5,requiredItem:"propulsion_drive",position:{x:0,y:1.2,z:-6.5},name:{en:"Aft Main Thruster Mount",zh:"\u98DE\u8239\u5C3E\u90E8\u4E3B\u63A8\u8FDB\u5F15\u64CE\u8231"},inspectDesc:{en:"Twin orbital engine mount. Install 1x Twin Plasma Propulsion Drive, then complete pre-flight checks!",zh:"\u98DE\u8239\u5C3E\u90E8\u4E3B\u63A8\u8FDB\u5668\u5B89\u88C5\u4F4D\uFF0C\u88C5\u5165\u3010\u53CC\u8054\u7B49\u79BB\u5B50\u4E3B\u63A8\u8FDB\u5668\u3011\u5E76\u5B8C\u6210\u8D77\u98DE\u524D\u5B89\u5168\u70B9\u68C0\u5373\u53EF\u8FD4\u822A\uFF01"}}},Di=[{id:"check_port_strut",position:{x:-3.85,z:-3.55},name:{en:"Port Landing Gear Hydraulic Lock",zh:"\u5DE6\u8D77\u843D\u67B6\u6DB2\u538B\u6536\u653E\u9501"}},{id:"check_starboard_valve",position:{x:3.85,z:-3.55},name:{en:"Starboard Plasma Manifold Seal",zh:"\u53F3\u8237\u71C3\u6599\u6B67\u7BA1\u5BC6\u5C01\u9600"}},{id:"check_boarding_hatch",position:{x:3.35,z:.45},name:{en:"Cabin Pressurization Hatch Latch",zh:"\u4E58\u5458\u8231\u6C14\u5BC6\u8231\u95E8\u9501\u6263"}}],bi={log_1:{id:"log_1",position:{x:-5.5,z:-8.2},region:"crash_basin",title:{en:"Crew Log #1 \u2014 Safe Orbital Ejection",zh:"\u8239\u5458\u65E5\u5FD7 #1 \u2014\u2014 \u8F68\u9053\u6551\u751F\u8231\u5B89\u5168\u5206\u79BB"},body:{en:'Captain Mira: "Sandstorm shear forced an emergency descent, so the crew ejected cleanly to the orbital relay pod. Milo stayed aboard to cushion the Starweaver! If Milo boots up \u2014 the Solar Furnace outside still works. Start with the Power Bay!"',zh:"\u7C73\u62C9\u8239\u957F\uFF1A\u201C\u9AD8\u7A7A\u6C99\u66B4\u5207\u53D8\u8FEB\u4F7F\u98DE\u8239\u7D27\u6025\u8FEB\u964D\uFF0C\u5168\u4F53\u8239\u5458\u5DF2\u5B89\u5168\u5F39\u5C04\u81F3\u8F68\u9053\u4E2D\u7EE7\u7AD9\u3002\u5C0F\u673A\u5668\u4EBA\u7C73\u6D1B\u7559\u5728\u8239\u4E0A\u7A33\u4F4F\u4E86\u7F13\u51B2\u59FF\u6001\uFF01\u7C73\u6D1B\uFF0C\u5982\u679C\u4F60\u9192\u6765\u770B\u5230\u8FD9\u6761\u8BB0\u5F55\u2014\u2014\u5916\u9762\u7684\u592A\u9633\u80FD\u7194\u70BC\u7089\u5B8C\u597D\u65E0\u635F\uFF0C\u5148\u4ECE\u4FEE\u590D\u52A8\u529B\u8231\u5F00\u59CB\u5427\uFF01\u201D"}},log_2:{id:"log_2",position:{x:53,z:-9.5},region:"whispering_ridge",title:{en:"Crew Log #2 \u2014 Harmonic Signal Cairns",zh:"\u8239\u5458\u65E5\u5FD7 #2 \u2014\u2014 \u4F4E\u8BED\u5C71\u810A\u7684\u8C10\u632F\u8DEF\u6807"},body:{en:'Engineer Tariq: "Our survey drone mapped pure Sun-Quartz and Silver veins up this eastern ridge. Activating the two Solar Cairns creates an electrostatic glide-field along the path!"',zh:"\u5DE5\u7A0B\u5E08\u5854\u91CC\u514B\uFF1A\u201C\u52D8\u6D4B\u65E0\u4EBA\u673A\u5728\u4E1C\u4FA7\u5C71\u810A\u53D1\u73B0\u4E86\u9AD8\u7EAF\u5EA6\u65E5\u5149\u77F3\u82F1\u4E0E\u94F6\u4E1D\u77FF\u3002\u70B9\u4EAE\u6CBF\u9014\u4E24\u5EA7\u5F15\u8DEF\u4FE1\u6807\u77F3\u8FD8\u80FD\u5F62\u6210\u9759\u7535\u52A9\u63A8\u573A\uFF0C\u8BA9\u5F80\u8FD4\u8425\u5730\u7684\u8DEF\u9014\u8F7B\u5FEB\u4E0D\u5C11\uFF01\u201D"}},log_3:{id:"log_3",position:{x:-6,z:54.5},region:"dry_canyon",title:{en:"Crew Log #3 \u2014 Subterranean Oasis Chemistry",zh:"\u8239\u5458\u65E5\u5FD7 #3 \u2014\u2014 \u5CE1\u8C37\u5730\u5E95\u7EFF\u6D32\u5316\u5B66\u5FD7"},body:{en:'Botanist Lin: "Beneath Kharis\u2019s dry crust, Zeolite beds and endothermic brine gel keep subterranean pockets cool. Combining an Activated Filter Scrubber with a Thermal Regulator will restore the Starweaver\u2019s bio-dome sprout!"',zh:"\u690D\u7269\u5B66\u5BB6\u6797\uFF1A\u201C\u5728\u5361\u91CC\u65AF\u5E72\u71E5\u7684\u5730\u8868\u4E0B\uFF0C\u591A\u5B54\u6CB8\u77F3\u5C42\u4E0E\u5438\u70ED\u51B7\u6CC9\u51DD\u80F6\u7EF4\u7CFB\u7740\u6E05\u51C9\u7684\u5FAE\u751F\u6001\u3002\u628A\u751F\u6001\u6D17\u6DA4\u5668\u4E0E\u6E29\u63A7\u5FAA\u73AF\u5668\u7EC4\u88C5\u8D

 "Our survey drone mapped pure Sun-Quartz and Silver veins up this eastern ridge. Activating the two Solar Cairns creates an electrostatic glide-field along the path!"',zh:"\u5DE5\u7A0B\u5E08\u5854\u91CC\u514B\uFF1A\u201C\u52D8\u6D4B\u65E0\u4EBA\u673A\u5728\u4E1C\u4FA7\u5C71\u810A\u53D1\u73B0\u4E86\u9AD8\u7EAF\u5EA6\u65E5\u5149\u77F3\u82F1\u4E0E\u94F6\u4E1D\u77FF\u3002\u70B9\u4EAE\u6CBF\u9014\u4E24\u5EA7\u5F15\u8DEF\u4FE1\u6807\u77F3\u8FD8\u80FD\u5F62\u6210\u9759\u7535\u52A9\u63A8\u573A\uFF0C\u8BA9\u5F80\u8FD4\u8425\u5730\u7684\u8DEF\u9014\u8F7B\u5FEB\u4E0D\u5C11\uFF01\u201D"}},log_3:{id:"log_3",position:{x:-6,z:54.5},region:"dry_canyon",title:{en:"Crew Log #3 \u2014 Subterranean Oasis Chemistry",zh:"\u8239\u5458\u65E5\u5FD7 #3 \u2014\u2014 \u5CE1\u8C37\u5730\u5E95\u7EFF\u6D32\u5316\u5B66\u5FD7"},body:{en:'Botanist Lin: "Beneath Kharis\u2019s dry crust, Zeolite beds and endothermic brine gel keep subterranean pockets cool. Combining an Activated Filter Scrubber with a Thermal Regulator will restore the Starweaver\u2019s bio-dome sprout!"',zh:"\u690D\u7269\u5B66\u5BB6\u6797\uFF1A\u201C\u5728\u5361\u91CC\u65AF\u5E72\u71E5\u7684\u5730\u8868\u4E0B\uFF0C\u591A\u5B54\u6CB8\u77F3\u5C42\u4E0E\u5438\u70ED\u51B7\u6CC9\u51DD\u80F6\u7EF4\u7CFB\u7740\u6E05\u51C9\u7684\u5FAE\u751F\u6001\u3002\u628A\u751F\u6001\u6D17\u6DA4\u5668\u4E0E\u6E29\u63A7\u5FAA\u73AF\u5668\u7EC4\u88C5\u8D77\u6765\uFF0C\u661F\u7EC7\u53F7\u751F\u6001\u8231\u91CC\u7684\u5C0F\u7EFF\u82BD\u5C31\u80FD\u91CD\u65B0\u8212\u5C55\u53F6\u7247\u5566\uFF01\u201D"}},log_4:{id:"log_4",position:{x:-64,z:8.5},region:"relay_gorge",title:{en:"Crew Log #4 \u2014 The Hard-Light Crossing",zh:"\u8239\u5458\u65E5\u5FD7 #4 \u2014\u2014 \u8DE8\u8D8A\u88C2\u8C37\u7684\u5149\u4E4B\u6865"},body:{en:'Navigator Sol: "Previous explorers built a photonic bridge over this gorge. Whenever desert winds tilt the two Solar Mirrors off-axis, realigning both pylons immediately restores the bridge deck and opens the Meteorite Star-Field."',zh:"\u9
